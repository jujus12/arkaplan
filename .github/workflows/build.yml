name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Inspect APK (Shizuku classes)
        continue-on-error: true
        run: |
          mkdir -p inspect && cd inspect
          unzip -q -o ../app/build/outputs/apk/debug/app-debug.apk 'classes*.dex'
          for f in classes*.dex; do
            echo "== $f"
            strings "$f" | grep -i -E 'shizuku.*(starter|server)|ServiceStarter|UserService' | sort -u | head -30
          done
          echo "== dependencies"
          cd ..
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon -q | grep -i rikka || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk arkaplan.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Arka Plan v${{ github.run_number }}
          files: arkaplan.apk
